<!doctype html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="alternate" hreflang="en" href="{{ en_url }}">
  <link rel="alternate" hreflang="zh-CN" href="{{ zh_url }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="alternate" type="application/rss+xml" title="{{ cfg.name }}" href="{{ root }}feed.xml">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E📰%3C/text%3E%3C/svg%3E">
  {% if view is defined and view and view.og_image %}<meta property="og:image" content="{{ view.og_image }}">{% endif %}
  <link rel="stylesheet" href="{{ cfg.base_path }}/assets/style.css">
</head>
<body>
  <a class="skip-link" href="{{ page_path }}#main">{{ strings.skip }}</a>
  <header>
    <nav class="languages" aria-label="EN | 中文"><a href="{{ en_url }}" lang="en" hreflang="en"{% if language == "en" %} aria-current="page"{% endif %}>EN</a><span>|</span><a href="{{ zh_url }}" lang="zh-CN" hreflang="zh-CN"{% if language == "zh" %} aria-current="page"{% endif %}>中文</a></nav>
    <a class="brand" href="{{ root }}">{{ cfg.name }}</a>
    <p>{{ tagline }}</p>
    <nav aria-label="{{ strings.navigation }}"><a href="{{ root }}">{{ strings.latest }}</a> <a href="{{ root }}archive/">{{ strings.archive }}</a> <a href="{{ root }}feed.xml">RSS</a></nav>
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer><p>{{ strings.footer }}</p><a href="{{ root }}archive/">{{ strings.browse }}</a> · <a href="{{ root }}feed.xml">{{ strings.subscribe }}</a></footer>
</body>
</html>
