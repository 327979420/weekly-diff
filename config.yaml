# The Weekly Diff — all settings live here.
# To rename, go live or pause, edit this file and commit. See README.md.

name: "The Weekly Diff"
tagline: "The week in AI and developer tools, in plain English."

tagline_zh: "每周 AI 与开发者工具速览，一分钟看完。"
tags_zh: {try: "🚀 马上能试", learn: "📚 学一招", watch: "👀 值得关注"}

content:
  max_headline_chars_zh: 40
  max_summary_words: 25
  max_summary_chars_zh: 70
  max_why_words: 40
  max_why_chars_zh: 100
  max_builders_words: 30
  max_builders_chars_zh: 90
  max_bullet_words: 30
  max_bullet_chars_zh: 80
  max_emoji_codepoints: 2
  summarise_max_tokens: 1800

# false = the Monday post goes to the private preview channel only.
# true  = the Monday post goes to the public Discord channel.
publish_enabled: false

# true = scheduled runs do nothing. Manual runs from the Actions tab still work.
paused: false

site:
  base_url: "https://327979420.github.io/weekly-diff"   # no trailing slash
  language: "en"
  timezone: "Australia/Melbourne"   # dates shown to readers
  image_domains_allowlist: [opengraph.githubassets.com]
  feed_items: 20

issue:
  lookback_days: 7
  min_items: 10
  max_items: 15
  hard_min_items: 5        # below this the run fails instead of publishing a thin issue
  top_items: 5             # items in the Discord post
  max_top_per_section: 2   # keeps the Discord top 5 varied
  max_headline_chars: 90
  sections:                # page order
    - key: models
      title_zh: "新模型与实验室"
      title: "New models & labs"
      min: 2
      max: 4
    - key: tools
      title_zh: "Agent 与开发工具"
      title: "Agent & dev tool updates"
      min: 2
      max: 4
    - key: github
      title_zh: "GitHub 热门"
      title: "Trending on GitHub"
      min: 3
      max: 4
    - key: quick
      title_zh: "快讯"
      title: "Quick hits"
      min: 2
      max: 4

tags: {try: "🚀 Try it now", learn: "📚 Learn", watch: "👀 Worth watching"}

llm:
  timeout_seconds: 180
  max_retries: 2
  provider: auto                    # auto | anthropic | openai. auto = Anthropic if ANTHROPIC_API_KEY is set, else OpenAI
  anthropic_model: "claude-haiku-5-5"
  openai_model: "gpt-5-mini"
  effort: low                       # Anthropic output_config.effort / OpenAI reasoning effort
  max_candidates_to_score: 80
  score_batch_size: 40
  max_source_chars: 12000           # source text sent to the summariser per item
  min_score: 4                      # 0–10; items below this are never selected

dedupe:
  title_similarity: 0.6             # Jaccard on title words; merges the same story from different sources
  seen_retention_days: 730

discord:
  color: 16734751                    # embed colour (decimal)

sources:
  retries: 2
  backoff_seconds: 0.5
  github_image_url: "https://opengraph.githubassets.com/1"
  github_api_url: "https://api.github.com"
  github_api_version: "2022-11-28"
  user_agent: "WeeklyDiffBot/1.0 (+https://github.com/327979420/weekly-diff)"
  timeout_seconds: 20

  # Links on these domains count as primary sources.
  primary_domains:
    - openai.com
    - anthropic.com
    - claude.com
    - claude.dev
    - blog.google
    - deepmind.google
    - ai.google.dev
    - developers.googleblog.com
    - ai.meta.com
    - mistral.ai
    - x.ai
    - deepseek.com
    - api-docs.deepseek.com
    - qwen.ai
    - qwenlm.github.io
    - moonshot.ai
    - kimi.com
    - z.ai
    - huggingface.co
    - github.com
    - github.blog
    - cursor.com
    - cline.bot
    - aider.chat

  rss:
    - { name: "OpenAI", url: "https://openai.com/news/rss.xml", section: models }
    - { name: "Google AI", url: "https://blog.google/technology/ai/rss/", section: models }
    - { name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml", section: models }
    - { name: "Mistral AI", url: "https://mistral.ai/rss.xml", section: models }
    - { name: "Hugging Face blog", url: "https://huggingface.co/blog/feed.xml", section: quick }
    - { name: "GitHub Changelog", url: "https://github.blog/changelog/feed/", section: tools }
    - { name: "Cursor", url: "https://cursor.com/changelog/rss.xml", section: tools }
    - { name: "Simon Willison", url: "https://simonwillison.net/atom/everything/", section: quick }
    - { name: "GitHub Copilot", url: "https://github.blog/changelog/label/copilot/feed/", section: tools }
    - { name: "Google Developers", url: "https://developers.googleblog.com/rss/", section: tools }
    - { name: "Vercel", url: "https://vercel.com/changelog/rss.xml", section: tools }
    - { name: "Supabase", url: "https://supabase.com/rss.xml", section: tools }
    - { name: "Replit", url: "https://blog.replit.com/feed.xml", section: tools }
    - { name: "Zed", url: "https://zed.dev/blog.rss", section: tools }

  # News pages without RSS: links matching link_pattern are opened and kept if their publish date is in the window.
  html_index:
    max_articles_per_index: 12
    pages:
      - { name: "Anthropic", url: "https://www.anthropic.com/news", link_pattern: '^https://www\.anthropic\.com/news/[a-z0-9-]+/?$', section: models }
      - { name: "Claude blog", url: "https://claude.com/blog", link_pattern: '^https://claude\.(com|dev)/blog/[a-z0-9-]+/?$', section: tools }
      - { name: "Meta AI", url: "https://ai.meta.com/blog/", link_pattern: '^https://ai\.meta\.com/blog/[a-z0-9-]+/?$', section: models }
      - { name: "Lovable", url: "https://lovable.dev/changelog", link_pattern: '^https://lovable\.dev/blog/[a-z0-9-]+/?$', section: tools }
      - { name: "DeepSeek", url: "https://api-docs.deepseek.com/", link_pattern: '^https://api-docs\.deepseek\.com/news/news\d+/?$', section: models }

  github_releases:
    per_page: 20
    max_text_chars: 8000
    include_prereleases: false
    repos:
      - { name: "Claude Code", repo: "anthropics/claude-code" }
      - { name: "Codex CLI", repo: "openai/codex" }
      - { name: "Gemini CLI", repo: "google-gemini/gemini-cli" }
      - { name: "Cline", repo: "cline/cline" }
      - { name: "Aider", repo: "Aider-AI/aider" }
      - { name: "Continue", repo: "continuedev/continue" }
      - { name: "OpenCode", repo: "anomalyco/opencode" }
      - { name: "Goose", repo: "aaif-goose/goose" }
      - { name: "OpenHands", repo: "OpenHands/OpenHands" }
      - { name: "Ollama", repo: "ollama/ollama" }
      - { name: "Zed", repo: "zed-industries/zed" }
      - { name: "Kilo Code", repo: "Kilo-Org/kilocode" }
      - { name: "Crush", repo: "charmbracelet/crush" }
      - { name: "Vercel AI SDK", repo: "vercel/ai" }
      - { name: "MCP servers", repo: "modelcontextprotocol/servers" }

  # Ranked by stars gained in the lookback window, never by total stars.
  github_trending:
    name: "GitHub"
    search_per_page: 50
    snapshot_min_days: 5
    snapshot_max_days: 9
    snapshot_history_limit: 6
    snapshot_retention_days: 30
    created_within_days: 30
    candidates: 40                 # top repos retained after ranking by weekly star gain
    exclude_repos: []
    queries:                       # {since} = window start, {created_since} = now - created_within_days (YYYY-MM-DD)
      - "created:>{since} stars:>50 topic:mcp-server"
      - "created:>{since} stars:>50 topic:claude-code"
      - "created:>{since} stars:>50 topic:vibe-coding"
      - "created:>{since} stars:>50 topic:cursor"
      - "created:>{since} stars:>50 topic:ai-coding"
      - "created:>{created_since} stars:>100 topic:llm"
      - "created:>{created_since} stars:>100 topic:ai-agents"
      - "created:>{created_since} stars:>100 topic:mcp"
      - "created:>{created_since} stars:>300"
      - "pushed:>{since} stars:>2000 topic:llm"
      - "pushed:>{since} stars:>2000 topic:ai-agents"

  hackernews:
    name: "Hacker News"
    api_url: "https://hn.algolia.com/api/v1/search"
    item_url: "https://news.ycombinator.com/item"
    hits_per_page: 500
    min_points: 150
    keywords: [AI, LLM, LLMs, GPT, OpenAI, Anthropic, Claude, Gemini, Llama, Mistral, DeepSeek, Qwen, Kimi, GLM, xAI, Grok, agent, agents, agentic, Copilot, Cursor, Codex, MCP, RAG, inference, fine-tuning, open-weight, model, models]

  huggingface:
    name: "Hugging Face"
    api_url: "https://huggingface.co/api/models"
    base_url: "https://huggingface.co"
    org_limit: 20
    trending_limit: 30
    created_within_days: 30
    orgs: [openai, google, meta-llama, mistralai, xai-org, deepseek-ai, Qwen, moonshotai, zai-org]
    repack_authors: [unsloth, bartowski, lmstudio-community, mlx-community, TheBloke, QuantFactory, MaziyarPanahi]

    # Verified live by Claude on 2026-10-13.
    spaces:
      enabled: true
      api_url: "https://huggingface.co/api/spaces"
      limit: 20
      created_within_days: 30

  reddit:
    enabled: false  # 2026-10-13: Reddit returns 403 to non-browser clients; keep off.
    name: "Reddit"
    api_url: "https://www.reddit.com/r/{sub}/top.json"
    base_url: "https://www.reddit.com"
    subreddits: [vibecoding, ClaudeAI, cursor, ChatGPTCoding, LocalLLaMA]
    limit: 25
    min_score: 300
